name: encore

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DATABASE_URL: postgresql://neondb_owner:npg_0BZUTrF8cAKt@ep-red-smoke-amrclagg-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - encore_net

  celery:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DATABASE_URL: postgresql://neondb_owner:npg_0BZUTrF8cAKt@ep-red-smoke-amrclagg-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - encore_net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - encore_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: encore
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore -d encore"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - encore_net

volumes:
  postgres_data:

networks:
  encore_net:
    driver: bridge
